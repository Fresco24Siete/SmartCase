name: smartcase-stack

services:
  # ── Base de Datos PostgreSQL ─────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: smartcase-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smartcase_password
      POSTGRES_DB: smartcase_db
    ports:
      - "5433:5432"
    volumes:
      - ./ESP32/bd.sql:/docker-entrypoint-initdb.d/01_init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartcase_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartcase-network

  # ── Backend Go REST API & WebSockets ────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcase-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:smartcase_password@db:5432/smartcase_db?sslmode=disable
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=smartcase_password
      - DB_NAME=smartcase_db
      - PORT=8080
      - SECRET=smartcase_secret_key_2026
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartcase-network

  # ── Frontend Web (Flutter + Nginx) ─────────────────────────
  frontend:
    build:
      context: ./metro_gps
      dockerfile: Dockerfile
    container_name: smartcase-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - smartcase-network

volumes:
  postgres_data:
    driver: local

networks:
  smartcase-network:
    driver: bridge
